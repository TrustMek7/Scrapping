services:
  postgres:
    image: postgres:16
    container_name: scrapping-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scrapping}
      POSTGRES_USER: ${POSTGRES_USER:-scrapping}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scrapping}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scrapping} -d ${POSTGRES_DB:-scrapping}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
